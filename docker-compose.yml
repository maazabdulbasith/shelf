services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
      POSTGRES_DB: shelf
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/010-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["qdrant"]
    ports:
      - "6333:6333"

  langfuse:
    image: langfuse/langfuse:2.93.6
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://shelf:shelf@postgres:5432/langfuse
      DIRECT_URL: postgresql://shelf:shelf@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: shelf-local-nextauth-secret
      SALT: shelf-local-salt
      TELEMETRY_ENABLED: "false"

volumes:
  pgdata:
