<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a1e12"/>
      <stop offset="50%" stop-color="#19130d"/>
      <stop offset="100%" stop-color="#0e0a07"/>
    </linearGradient>
    <linearGradient id="borderGold" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="shelfRail" x1="10" y1="48" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg)" stroke="url(#borderGold)" stroke-width="2"/>

  <!-- Back Screenshot Stack (Offset depth) -->
  <rect x="14" y="14" width="30" height="23" rx="4.5" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.45"/>

  <!-- Front Screenshot Card (Crisp Frame) -->
  <rect x="20" y="20" width="30" height="23" rx="4.5" fill="#140f0a" stroke="url(#borderGold)" stroke-width="1.8"/>

  <!-- Document OCR Lines (Content visualization) -->
  <line x1="25" y1="26" x2="37" y2="26" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="25" y1="31" x2="45" y2="31" stroke="#fef3c7" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="25" y1="36" x2="40" y2="36" stroke="#fef3c7" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Viewfinder Target Dot (Search / Precision Indicator) -->
  <circle cx="44" cy="26" r="1.6" fill="#f59e0b"/>

  <!-- The Shelf: Glowing Illuminated Resting Rail -->
  <path d="M10 49h44" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.4" filter="url(#softGlow)"/>
  <path d="M12 49h40" stroke="url(#shelfRail)" stroke-width="2.4" stroke-linecap="round"/>
</svg>