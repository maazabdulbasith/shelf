name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shelf
          POSTGRES_PASSWORD: shelf
          POSTGRES_DB: shelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelf -d shelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://shelf:shelf@localhost:5432/shelf
      SHELF_SKIP_WATCH: "1"
      DISABLE_SQLALCHEMY_CEXT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install --no-binary sqlalchemy sqlalchemy
      - name: Unit tests
        run: python -m pytest apps/api/tests -q
        env:
          PYTHONPATH: apps/api
          DATABASE_URL: ""
      - name: Golden set and retrieval gate
        run: |
          python eval/make_golden.py
          python eval/run_eval.py
        env:
          PYTHONPATH: apps/api
